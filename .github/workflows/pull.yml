name: Pull actions

on:
  pull_request:

jobs:
  validate:
    runs-on: "ubuntu-latest"
    name: Validate
    steps:
        - uses: "actions/checkout@v7"

        - name: HACS validation
          uses: "hacs/action@main"
          with:
            category: "integration"

        - name: Hassfest validation
          uses: "home-assistant/actions/hassfest@master"

  style:
    runs-on: "ubuntu-latest"
    name: Check style formatting
    steps:
        - uses: "actions/checkout@v7"
          with:
            fetch-depth: 0
        - uses: "actions/setup-python@v7"
          with:
            python-version: "3.x"
        - run: python3 -m pip install black==26.10.0
        - name: Check formatting of the files this PR changes
          run: |
            base="${{ github.event.pull_request.base.sha }}"
            files=$(git diff --name-only --diff-filter=d "$base"...HEAD -- '*.py')
            if [ -z "$files" ]; then
              echo "This PR changes no Python files; nothing to check."
              exit 0
            fi
            echo "Checking:"
            echo "$files"
            black --check --diff $files

  tests:
    runs-on: "ubuntu-latest"
    name: Run tests
    steps:
      - name: Check out code from GitHub
        uses: "actions/checkout@v7"
      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
      - name: Install requirements
        run: python3 -m pip install -r requirements_test.txt
      - name: Run tests
        run: |
          pytest \
            -qq \
            --timeout=9 \
            --durations=10 \
            -n auto \
            --cov custom_components.dahua \
            -o console_output_style=count \
            -p no:sugar \
            tests

# Keeps the workflow actions from going stale, and nothing else.
#
# Only github-actions is watched, deliberately. actions/checkout sat on v2 from 2020
# until it was bumped by hand, which is the failure this catches: an action version
# going quietly five years out of date, with the only symptom a deprecation warning
# nobody reads at the end of a passing run.
#
# pip is NOT watched. requirements_test.txt pins
# pytest-homeassistant-custom-component, which tracks Home Assistant's own releases and
# therefore moves most weeks. That would open a pull request most weeks for a test-only
# pin, on a repository that already receives plenty. The integration itself declares no
# requirements in its manifest, so nothing a user installs has a dependency to update.
#
# Monthly rather than weekly for the same reason: an action version going a few weeks
# unnoticed costs nothing, and this should be a quiet reminder rather than a queue.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # One pull request for all of them rather than one each, since they are almost
    # always bumped together and reviewed in one go.
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
    open-pull-requests-limit: 2
